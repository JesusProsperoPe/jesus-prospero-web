# Panel de administración (Decap CMS)
backend:
  name: github
  repo: JesusProsperoPe/jesus-prospero-web
  branch: main
  commit_messages:
    create: "Nueva noticia: {{slug}}"
    update: "Editar noticia: {{slug}}"
    delete: "Borrar noticia: {{slug}}"
    uploadMedia: "Subir imagen: {{path}}"
    deleteMedia: "Borrar imagen: {{path}}"

site_url: https://jesusprospero.pages.dev
display_url: https://jesusprospero.pages.dev
logo_url: /img/icono-192.png

# Dónde se guardan las fotos que subes
media_folder: src/img/uploads
public_folder: /img/uploads

# Las fotos del celular se achican y comprimen al subirlas (WebP, máx. 2000 px)
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  - name: noticias
    label: Noticias
    label_singular: Noticia
    description: Escribe y publica tus noticias. Aparecen en el sitio uno o dos minutos después de guardarlas.
    folder: src/noticias
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date | date('DD/MM/YYYY HH:mm')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titular", name: "title", widget: "string" }
      - { label: "Titular para Google (opcional)", name: "titulo_seo", widget: "string", required: false,
          hint: "Lo que aparece en Google. Pon el nombre que la gente busca, por ejemplo «Arturo Alegría dice que la crisis climática fue una moda». En la web y en redes se sigue viendo el titular de arriba." }
      - { label: "Temas", name: "temas", widget: "list", required: false,
          hint: "Personajes, partidos o asuntos de la nota, separados por coma. Ejemplo: Congreso, Fuerza Popular, Keiko Fujimori. Escríbelos siempre igual para que se junten en la misma página." }
      - { label: "Fecha y hora", name: "date", widget: "datetime" }
      - { label: "Bajada (resumen corto)", name: "resumen", widget: "text", required: false,
          hint: "Una o dos líneas que aparecen bajo el titular y en la portada." }
      - { label: "Foto principal", name: "imagen", widget: "image", required: false }
      - { label: "Pie de foto", name: "imagen_texto", widget: "string", required: false,
          hint: "Qué se ve en la foto." }
      - { label: "Fuente de la foto", name: "imagen_fuente", widget: "string", required: false,
          hint: "De dónde viene. Ejemplos: «Foto: Andina», «Captura de X», «Imagen referencial»." }
      - { label: "Tipo de texto", name: "tipo", widget: "select", required: false, default: "Columna",
          options: ["Columna", "Análisis", "Opinión", "Noticia"],
          hint: "Noticia (solo hechos) va a la sección Noticias. Columna, Análisis y Opinión van a la sección Columnas." }
      - { label: "Solo para suscriptores", name: "exclusivo", widget: "boolean", required: false, default: false,
          hint: "Si lo marcas, todos ven los 2 primeros párrafos y el resto solo los suscriptores." }
      - { label: "Enlace corto (opcional)", name: "corto", widget: "string", required: false,
          hint: "Una o dos palabras, por ejemplo holguin: la nota se comparte como jesusprospero.pe/n/holguin. Si lo dejas vacío, se crea uno solo." }
      - { label: "Texto completo", name: "body", widget: "markdown" }

  - name: vinetas
    label: Viñetas
    label_singular: Viñeta
    description: Sube una viñeta o caricatura. Aparece en la sección Viñetas y en la portada uno o dos minutos después de guardarla.
    folder: src/vinetas
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date | date('DD/MM/YYYY HH:mm')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Temas", name: "temas", widget: "list", required: false,
          hint: "Personajes, partidos o asuntos de la viñeta, separados por coma. Ejemplo: Keiko Fujimori, Fuerza Popular." }
      - { label: "Fecha y hora", name: "date", widget: "datetime" }
      - { label: "Viñeta", name: "imagen", widget: "image",
          hint: "La imagen completa. Se muestra entera, sin recortes." }
      - { label: "Qué se ve en la viñeta", name: "imagen_texto", widget: "string", required: false,
          hint: "Una frase que describa la imagen. Sirve para Google y para quienes no pueden verla." }
      - { label: "Autor o fuente", name: "imagen_fuente", widget: "string", required: false,
          hint: "Ejemplos: «Viñeta: Jesus Prospero», «Ilustración: Carlín». Déjalo vacío si no corresponde." }
      - { label: "Enlace corto (opcional)", name: "corto", widget: "string", required: false,
          hint: "Una o dos palabras, por ejemplo moda-ambiental: se comparte como jesusprospero.pe/n/moda-ambiental. Si lo dejas vacío, se crea uno solo." }
      - { label: "Texto (opcional)", name: "body", widget: "markdown", required: false,
          hint: "Un comentario corto que aparece debajo de la viñeta." }

  - name: mentiras
    label: Contador de Keiko
    label_singular: Caso
    description: "Cada caso suma al contador de la portada. Solo los marcados como «Falso» cuentan como mentira; los demás se muestran aparte. Pon siempre el enlace de lo que dijo y la prueba."
    folder: src/mentiras
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{categoria}} · {{title}} · {{date | date('DD/MM/YYYY')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Lo que dijo (frase textual)", name: "title", widget: "string",
          hint: "Copia la frase tal cual, sin comillas. Ejemplo: No hemos subido ningún impuesto." }
      - { label: "Fecha en que lo dijo", name: "date", widget: "datetime" }
      - { label: "Dónde lo dijo", name: "donde", widget: "string",
          hint: "Ejemplo: Mensaje a la Nación, entrevista en RPP, conferencia en Palacio." }
      - { label: "Enlace a lo que dijo", name: "fuente_url", widget: "string",
          hint: "Video, nota o publicación donde se le escucha o se le lee." }
      - { label: "Categoría", name: "categoria", widget: "select", default: "En revisión",
          options: ["Falso", "Engañoso", "Se contradijo", "En revisión"],
          hint: "Falso: hay prueba de que no es cierto (es lo único que suma al contador). Engañoso: verdad a medias. Se contradijo: antes dijo lo contrario. En revisión: hay sospecha pero todavía no hay prueba." }
      - { label: "Lo cierto", name: "body", widget: "markdown",
          hint: "Explica en 2 o 3 líneas qué es lo verdadero y por qué lo que dijo no lo es." }
      - label: "Pruebas"
        name: "pruebas"
        widget: "list"
        required: false
        summary: "{{fields.texto}}"
        hint: "Documentos, cifras oficiales, videos anteriores. Una prueba por línea."
        fields:
          - { label: "Qué es", name: "texto", widget: "string", hint: "Ejemplo: Reporte de la SUNAT de setiembre 2026" }
          - { label: "Enlace", name: "url", widget: "string", required: false }

  - name: ajustes
    label: Ajustes del sitio
    editor: { preview: false }
    files:
      - name: autor
        label: Sobre mí (foto y presentación)
        file: src/_data/autor.json
        fields:
          - { label: "Mi foto", name: "foto", widget: "image",
              hint: "Mejor una foto cuadrada. Aparece en la cabecera, en la portada, en cada noticia y en Suscríbete." }
          - { label: "Presentación", name: "bio", widget: "text",
              hint: "Solo se usa si 'Mi historia' está vacía. Si tienes historia, la portada muestra su primer párrafo." }
          - { label: "Mi historia (opcional)", name: "historia", widget: "markdown", required: false,
              hint: "Texto largo para la página Sobre mí: quién eres, tu trayectoria, por qué haces este trabajo." }
      - name: sitio
        label: Datos del sitio
        file: src/_data/site.json
        fields:
          - { label: "Nombre del sitio", name: "nombre", widget: "string" }
          - { label: "Lema (opcional)", name: "lema", widget: "string", required: false,
              hint: "Frase corta bajo tu nombre en la cabecera. Déjalo vacío para no mostrar ninguna." }
          - { label: "Descripción (para Google y redes)", name: "descripcion", widget: "text" }
          - { label: "Dirección del sitio", name: "url", widget: "string",
              hint: "Ejemplo: https://jesusprospero.pe (sin / al final)" }
          - { label: "Link de Instagram", name: "instagram", widget: "string" }
          - { label: "Link de TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "Link de Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Correo de contacto", name: "correo", widget: "string" }
          - { label: "Número de Yape", name: "yape_numero", widget: "string", required: false,
              hint: "Aparece bajo el QR al final de cada nota. Déjalo vacío para no mostrarlo." }
          - { label: "Nombre en Yape", name: "yape_nombre", widget: "string", required: false }
      - name: aportes
        label: Planes de aporte mensual
        file: src/_data/aportes.json
        fields:
          - label: "Planes"
            name: "planes"
            widget: "list"
            summary: "{{fields.nombre}} · S/{{fields.monto}} al mes"
            hint: "El monto debe coincidir con el del plan creado en Mercado Pago."
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Monto mensual (soles)", name: "monto", widget: "number", value_type: "float", min: 1 }
              - { label: "Link del plan en Mercado Pago", name: "link", widget: "string", required: false,
                  hint: "El link de suscripción del plan. Debe contener preapproval_plan_id=…" }
